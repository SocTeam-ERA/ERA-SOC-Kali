{
  "options": {
    "logger_path": "/var/log/osquery",
    "logger_min_status": "1",
    "host_identifier": "hostname",
    "schedule_splay_percent": "10",
    "disable_events": "true",
    "utc": "true"
  },
  "decorators": {
    "load": [
      "SELECT hostname FROM system_info;"
    ]
  },
  "schedule": {
    "listening_ports": {
      "query": "SELECT DISTINCT lp.port, lp.protocol, lp.address, p.name, p.path FROM listening_ports lp LEFT JOIN processes p ON lp.pid = p.pid WHERE lp.family IN (2, 10) AND lp.protocol IN (6, 17) AND lp.address NOT IN ('127.0.0.1', '::1') AND lp.port < 32768 AND lp.port != 0 AND (p.name IS NULL OR p.name != 'kdeconnectd');",
      "interval": 300,
      "description": "New/closed non-loopback TCP/UDP listening sockets on real ports (<32768, i.e. not OS-assigned ephemeral) -- host-side view, catches services nmap can't see if firewalled from the network. Confirmed empirically on this box that the unfiltered table is almost all noise: AF_UNIX sockets with no real address/port (dbus-daemon, systemd, Xorg, pipewire -- filtered by family IN (2,10)), raw-socket ICMP entries (filtered by protocol IN (6,17)), and kdeconnectd, which continuously opens/closes dozens of ephemeral high ports as part of normal KDE Connect operation (filtered by name != 'kdeconnectd' and port < 32768) -- without these filters this query alone produced ~500 rows on a single host in a few minutes. kdeconnectd's stable control ports (1716/1717) are NOT ephemeral and still get seen. Trade-off: a backdoor deliberately bound above 32768 would be missed by this specific check, but the network-facing nmap scans and Suricata still cover that port range from the wire side."
    },
    "local_users": {
      "query": "SELECT uid, username, shell, directory FROM users;",
      "interval": 3600,
      "description": "New/removed local user accounts -- persistence indicator."
    },
    "cron_jobs": {
      "query": "SELECT command, path, minute, hour, day_of_month, month, day_of_week FROM crontab;",
      "interval": 3600,
      "description": "New/removed scheduled tasks -- common persistence mechanism."
    },
    "suid_binaries": {
      "query": "SELECT path, username, groupname, permissions FROM suid_bin;",
      "interval": 21600,
      "description": "New setuid/setgid binaries appearing on disk -- privilege escalation indicator. Runs every 6h (filesystem-wide search, heavier)."
    },
    "kernel_modules_loaded": {
      "query": "SELECT name, size, status FROM kernel_modules;",
      "interval": 3600,
      "description": "Loaded/unloaded kernel modules -- rootkit indicator. Re-added after diagnosing an earlier false alarm: the real diagnostic (querying osquery_schedule on the live daemon) showed listening_ports/local_users/cron_jobs/suid_binaries had all been executing normally the whole time -- osquery's differential logger just stays silent when nothing changed, which looked like a hang from the results.log alone but wasn't. This query's total absence from every log, even its mandatory first-ever baseline dump, was the one genuinely unexplained signal -- worth a real look now with that better diagnostic in hand."
    }
  }
}

## Sentinel SOC -- Zeek cluster config.
## One worker per physical NIC, matching how Suricata is set up (one
## af-packet entry per interface, each watching its own VLAN):
##   eth0 = Floor (10.69.0.0/16)        eth3 = Printers (192.168.61.0/24)
##   eth1 = Management (10.201.0.0/16)  eth4 = Office (192.168.7.0/24)
##   eth2 = Wiping (10.21.0.0/16)       eth5 = Guest/Employee WiFi (192.168.8.0/24)
## All on localhost -- this is a single appliance, not a real cluster, but
## zeekctl needs the cluster topology (manager + proxy + workers) to run
## more than one capturing process at once.

[manager]
type=manager
host=localhost

[proxy-1]
type=proxy
host=localhost

[worker-floor]
type=worker
host=localhost
interface=eth0
# Floor (eth0) carries 2-6x the traffic of every other VLAN here (76.8M vs
# 33.7M packets received on the next-busiest, eth1, as of 2026-09-17) and a
# single worker process can't keep up -- confirmed via repeated
# CaptureLoss::Too_Much_Loss notices (~100% loss) every ~15min, Zeek's
# default CaptureLossPeriod, while every other VLAN's worker stayed clean.
# Split it across the kernel's AF_PACKET fanout so no one process has to
# keep up with all of it. First tried lb_procs=2 (2026-09-17 ~11:22): held
# for 30 minutes, then worker-floor-2 alone hit 99.9% loss again -- 2 wasn't
# enough headroom, not just an even split. Bumped to 3.
lb_method=af_packet
lb_procs=3

[worker-management]
type=worker
host=localhost
interface=eth1

[worker-wiping]
type=worker
host=localhost
interface=eth2

[worker-printers]
type=worker
host=localhost
interface=eth3

[worker-office]
type=worker
host=localhost
interface=eth4

[worker-guestwifi]
type=worker
host=localhost
interface=eth5

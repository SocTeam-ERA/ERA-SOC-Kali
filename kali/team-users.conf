# Team accounts for the Kali appliance.  Format:   username:role
# ---------------------------------------------------------------
#   role = admin  -> full sudo. Manages the box, runs privileged scans
#                    (nmap SYN, zmap, tshark capture). "Where everything
#                    is managed."
#   role = dev    -> NO sudo / NO root. For software + connectivity testing
#                    only (can run the dashboard, connect-scans, edit the
#                    project files via the shared 'soc' group), but cannot
#                    change the system or run privileged scans. Least privilege.
#
# A public key in team_keys/<username>.pub gives key-based login; otherwise
# the script sets a random temp password that must be changed on first login.
#
# Edit the lines below for your team (remove the leading #):

#socadmin:admin      # the master admin / management account
#arturo:admin        # security lead
#sixto:dev           # developer — no root
#tomas:dev           # developer — no root

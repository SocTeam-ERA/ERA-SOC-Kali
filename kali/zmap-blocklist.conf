# =====================================================================
#  zmap-blocklist.conf  —  custom blocklist for INTERNAL scanning
# =====================================================================
#  WHY THIS FILE EXISTS
#  zmap ships with /etc/zmap/blocklist.conf that blocks the RFC1918
#  private ranges (10/8, 172.16/12, 192.168/16). That is correct for
#  Internet-wide research, but it is exactly why zmap "does not scan
#  internal ranges" out of the box — your company subnets are blocked.
#
#  This blocklist blocks ONLY the truly non-scannable/special space and
#  DELIBERATELY LEAVES RFC1918 SCANNABLE, so zmap can sweep internal
#  networks. Use it with:  zmap -b kali/zmap-blocklist.conf ...
#
#  Only ever run zmap against subnets IT has authorized in writing.
# ---------------------------------------------------------------------

0.0.0.0/8          # "this" network / invalid source
127.0.0.0/8        # loopback
169.254.0.0/16     # link-local (APIPA)
224.0.0.0/4        # multicast
240.0.0.0/4        # reserved / future use
255.255.255.255/32 # limited broadcast

# NOTE: RFC1918 private ranges are intentionally NOT listed here so that
# internal scanning works. If you want to *whitelist* only specific
# subnets instead, use zmap's --allowlist-file / -w flag with a file of
# the exact CIDRs, which is stricter and recommended for production runs.
